minimumReleaseAge: 2160
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  ffmpeg-static: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - oxlint-plugin-react-doctor
  - react-doctor
  - wrangler
  - miniflare
  - deslop-js
